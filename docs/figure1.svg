<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 836" width="960" height="836" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="B-MiRA architecture: retrieve, build the evidence graph, weigh competing pathways, repeat until the stop rule fires, then write a verified report">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333333"/></marker></defs>
