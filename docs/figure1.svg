<text x="610.0" y="293.2" font-size="10.5" font-weight="normal" fill="#555555" text-anchor="middle">ontology concepts</text>
<rect x="378" y="238" width="136" height="72" rx="3" fill="#F1F1F1" stroke="#444444" stroke-width="1.2"/>
<text x="446.0" y="265.8" font-size="12.5" font-weight="bold" fill="#111111" text-anchor="middle">Grade claims</text>
<text x="446.0" y="279.8" font-size="10.5" font-weight="normal" fill="#555555" text-anchor="middle">per-claim system;</text>
